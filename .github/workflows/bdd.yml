name: BDD

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  bdd:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install BDD dependencies
        run: python -m pip install -r bdd/requirements.txt

      - name: Run BDD suite
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_URL: ${{ secrets.LLM_API_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: behave bdd/features

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Record LLM session with VHS
        uses: charmbracelet/vhs-action@v2
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_URL: ${{ secrets.LLM_API_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        with:
          path: vhs/bdd-llm.tape

      - name: Commit VHS gif
        run: |
          if git status --porcelain docs/assets/llm-bdd.gif | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/assets/llm-bdd.gif
            git commit -m "Update BDD VHS recording"
            git push
          fi
